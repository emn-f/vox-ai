name: 💾 Supabase Database Backup

on:
  schedule:
    # Executa todo domingo às 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite disparo manual via GitHub Actions

permissions:
  contents: read

jobs:
  backup:
    name: Backup e Arquivamento de Dados
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ⚡ Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: 📦 Instalar Dependências
        run: uv sync

      - name: 🚀 Executar Script de Backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE_URL_DEV }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY_PROD || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          uv run python scripts/backup_supabase.py --output-dir backups_output

      - name: 🔍 Validar Integridade do Backup
        run: |
          if [ ! -d "backups_output" ] || [ -z "$(ls -A backups_output)" ]; then
            echo "❌ Diretório de backup inexistente ou vazio."
            exit 1
          fi

          MANIFEST=$(find backups_output -name "manifest.json" | head -n 1)
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "❌ Manifesto do backup (manifest.json) não foi gerado."
            exit 1
          fi

          echo "📋 Verificando status do manifesto..."
          STATUS=$(python -c "import json; m=json.load(open('$MANIFEST')); print(m.get('status', 'unknown'))")
          echo "Status do manifesto: $STATUS"

          if [ "$STATUS" != "success" ]; then
            echo "❌ O backup não foi concluído com status 'success' (status atual: $STATUS)."
            echo "Abortando upload de artefato para não persistir backups corrompidos ou parciais."
            exit 1
          fi

          echo "✅ Backup íntegro e validado com sucesso."

      - name: 📤 Upload do Artefato de Backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backups_output/
          retention-days: 30

      - name: 📊 Gerar Step Summary do Backup
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          echo "## 💾 Relatório de Backup do Supabase" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ Backup íntegro concluído |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falha no backup |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Retenção** | 30 dias (GitHub Artifacts) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run Number** | \`#${RUN_NUM}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Data/Hora** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          if [ -d "backups_output" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Arquivos Gerados" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh backups_output/ >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
