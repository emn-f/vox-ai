name: 💾 Supabase Database Backup

on:
  schedule:
    # Executa todo domingo às 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite disparo manual via GitHub Actions

permissions:
  contents: read

jobs:
  backup:
    name: Backup e Arquivamento de Dados
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ⚡ Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: 📦 Instalar Dependências
        run: uv sync

      - name: 🚀 Executar Script de Backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          uv run python scripts/backup_supabase.py --output-dir backups_output

      - name: 📤 Upload do Artefato de Backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backups_output/
          retention-days: 30
