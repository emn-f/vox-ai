name: 🫴🏽 Manual Release (Major/Minor/Patch)

on:
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Tipo de incremento de versão'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  manual_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_DEPLOY_VOX }}

      - name: Configurar Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calcular Próxima Versão
        id: get_tag
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_INCREMENT_TYPE: ${{ github.event.inputs.increment_type }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TOKEN_DEPLOY_VOX }}
        run: |
          if [ "$REF_NAME" == "develop" ]; then
            PREFIX="dev-v"
          else
            PREFIX="v"
          fi

          LAST_TAG=$(git tag --list "${PREFIX}*" --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="${PREFIX}0.0.0"
          fi

          echo "Última versão: $LAST_TAG"
          
          VERSION=${LAST_TAG#$PREFIX}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          INCREMENT_TYPE="$INPUT_INCREMENT_TYPE"
          echo "Tipo de incremento selecionado: $INCREMENT_TYPE"

          if [ "$INCREMENT_TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT_TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            # Default to patch
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"

          echo "Nova versão calculada: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          git tag $NEW_TAG

          git remote set-url origin "https://emn-f:${TOKEN}@github.com/${REPO}.git"
          
          git push origin "$REF_NAME" --tags

          echo "✅ Versão Manual ${NEW_TAG} lançada!"

      - name: 📊 Gerar Step Summary do Release Manual
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NEW_TAG: ${{ steps.get_tag.outputs.new_tag }}
          INCREMENT_TYPE: ${{ github.event.inputs.increment_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## 🫴🏽 Relatório de Release Manual" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ Versão gerada e publicada |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falha no release |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Nova Tag** | \`$NEW_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo de Incremento** | \`$INCREMENT_TYPE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch Alvo** | \`$REF_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY
