name: 🚧 Versioning the Develop branch
on:
  push:
    branches:
      - develop
permissions:
  contents: write

jobs:
  tag_dev_only:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Git User
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Calcular Próxima Versão Dinâmica Develop (SemVer via Conventional Commits)
      id: calc_version
      run: |
        python3 scripts/calc_next_version.py --prefix "dev-v" --export-github

    - name: Criar Tag e Push (Sem Changelog)
      run: |
        NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
        
        # Apenas cria a tag no commit atual e sobe
        git tag $NEW_TAG
        git push origin $NEW_TAG

    - name: 📊 Gerar Step Summary do Versionamento Develop
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
        NEW_TAG: ${{ steps.calc_version.outputs.new_tag }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        echo "## 🚧 Relatório de Versionamento (Develop)" >> $GITHUB_STEP_SUMMARY
        echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        if [ "$JOB_STATUS" = "success" ]; then
          echo "| **Status** | ✅ Tag gerada com sucesso |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| **Status** | ❌ Falha no versionamento |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "| **Tag Develop** | \`$NEW_TAG\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | \`develop\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY
