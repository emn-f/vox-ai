name: 🚧 Versioning the Develop branch
on:
  push:
    branches:
      - develop
permissions:
  contents: write

jobs:
  tag_dev_only:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Git User
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Calcular Próxima Versão Dinâmica Develop (SemVer via Conventional Commits)
      id: calc_version
      run: |
        python3 scripts/calc_next_version.py --prefix "dev-v" --export-github

    - name: Criar Tag e Push (Sem Changelog)
      run: |
        NEW_TAG="${{ steps.calc_version.outputs.new_tag }}"
        
        # Apenas cria a tag no commit atual e sobe
        git tag $NEW_TAG
        git push origin $NEW_TAG
