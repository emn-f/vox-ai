name: 🤗 Deploy no Hugging Face
on:
  workflow_run:
    workflows:  ["🚀 Production Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-hub:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Filter binaries and Push Snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configurar Git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Criar branch orfã (sem histórico) para o deploy
          git checkout --orphan release-branch

          # Remover documentação e arquivos binários não aceitos pelo Hugging Face
          git rm -rf docs/ || true
          find static/ -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.pdf" \) -exec git rm -f {} + || true

          # Commit apenas do estado atual (Snapshot)
          git commit -m "chore(deploy): snapshot release [skip ci]"

          # Push forçado para a main do Hugging Face
          git push --force https://emn-f:$HF_TOKEN@huggingface.co/spaces/emn-f/vox-ai release-branch:main

      - name: 📊 Gerar Step Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## 🤗 Relatório de Deploy no Hugging Face Spaces" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Space URL** | [hf.co/spaces/emn-f/vox-ai](https://huggingface.co/spaces/emn-f/vox-ai) |" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status do Deploy** | ✅ Snapshot sincronizado com sucesso |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status do Deploy** | ❌ Falha na sincronização |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **SDK Streamlit** | \`1.67.0\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Runtime** | \`3.13\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit Fonte** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 *O Hugging Face Spaces compilará automaticamente o container com Streamlit 1.67.0 e as dependências do requirements.txt.*" >> $GITHUB_STEP_SUMMARY
