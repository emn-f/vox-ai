name: 📋 Updating the homologation environment
on:
    workflow_dispatch:
permissions:
    contents: write

jobs:
    update_homo:
        runs-on: ubuntu-latest
        steps:
            - name: Update Homo
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Configurar Git User
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Pull changes from develop to homo
              run: |
                    git checkout homo
                    git fetch origin develop
                    git merge origin/develop --no-edit

            - name: Push changes to homo
              run: |
                    git push origin homo

            - name: 📊 Gerar Step Summary da Homologação
              if: always()
              env:
                JOB_STATUS: ${{ job.status }}
                COMMIT_SHA: ${{ github.sha }}
              run: |
                echo "## 📋 Relatório de Atualização de Homologação" >> $GITHUB_STEP_SUMMARY
                echo "| Campo | Detalhe |" >> $GITHUB_STEP_SUMMARY
                echo "|---|---|" >> $GITHUB_STEP_SUMMARY
                if [ "$JOB_STATUS" = "success" ]; then
                  echo "| **Status** | ✅ Homologação atualizada com sucesso |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| **Status** | ❌ Falha na mesclagem |" >> $GITHUB_STEP_SUMMARY
                fi
                echo "| **Branch Alvo** | \`homo\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Origem** | \`develop\` |" >> $GITHUB_STEP_SUMMARY
                echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY