name: 🔄 Develop Changelog Update

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Develop Branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.TOKEN_DEPLOY_VOX }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch main
        run: git fetch origin main

      - name: Checkout Changelog from main
        run: git checkout origin/main -- CHANGELOG.md

      - name: Commit and Push Changes
        run: |
          if [[ -n $(git status -s CHANGELOG.md) ]]; then
            git add CHANGELOG.md
            git commit -m "chore: sync CHANGELOG.md from main"
            git push origin develop
            echo "CHANGELOG_SYNCED=true" >> $GITHUB_ENV
          else
            echo "No changes to sync."
            echo "CHANGELOG_SYNCED=false" >> $GITHUB_ENV
          fi

      - name: 📊 Gerar Step Summary da Sincronização
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🔄 Relatório de Sincronização do CHANGELOG na Develop" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ Concluído |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falha |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Branch Alvo** | \`develop\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Origem** | \`main (CHANGELOG.md)\` |" >> $GITHUB_STEP_SUMMARY
          if [ "$CHANGELOG_SYNCED" = "true" ]; then
            echo "| **Ação** | 📝 Changelog atualizado e comitado na develop |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Ação** | ℹ️ Changelog já estava atualizado |" >> $GITHUB_STEP_SUMMARY
          fi
