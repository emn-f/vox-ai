name: 🚀 Production Pipeline
on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Dependencies
        run: uv sync
      - name: Run Tests
        run: uv run pytest
      - name: 📊 Summary de Testes
        if: always()
        run: |
          echo "## 🧪 Relatório de Testes Automatizados (Produção)" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ 100% Aprovados' || '❌ Falhas detectadas' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Runtime** | \`3.13\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Manager** | \`uv (astral-sh/setup-uv@v5)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  release_prod:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_DEPLOY_VOX }}

      - name: Configurar Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calcular Próxima Versão Dinâmica (SemVer via Conventional Commits)
        id: get_tag
        run: |
          python3 scripts/calc_next_version.py --prefix "v" --export-github

      - name: Gerar Changelog (Git Cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.get_tag.outputs.new_tag }} --prepend CHANGELOG.md

      - name: Commitar, Taggear e Push
        env:
          NEW_TAG: ${{ steps.get_tag.outputs.new_tag }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TOKEN_DEPLOY_VOX }}
        run: |
          git add CHANGELOG.md

          if git diff --staged --quiet; then
            echo "🚫 Changelog não mudou."
          else
            git commit -m "chore(release): changelog atualizado para versão ${NEW_TAG} [skip ci]"
          fi

          git tag "$NEW_TAG"

          git remote set-url origin "https://emn-f:${TOKEN}@github.com/${REPO}.git"
          
          git push origin main --tags

          echo "✅ Versão Oficial ${NEW_TAG} lançada!"

      - name: Verificar se o último deploy do banco falhou e re-executar
        env:
          GH_TOKEN: ${{ secrets.TOKEN_DEPLOY_VOX }}
        run: |
          STATUS=$(gh run list --workflow deploy_db.yml --limit 1 --json status --jq '.[0].status' 2>/dev/null || echo "")
          CONCLUSION=$(gh run list --workflow deploy_db.yml --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "")
          
          echo "Último status do deploy_db: $STATUS"
          echo "Última conclusão do deploy_db: $CONCLUSION"
          
          if [ "$STATUS" = "completed" ] && { [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "timed_out" ]; }; then
            echo "⚠️ O último deploy do banco falhou ou foi cancelado. Disparando deploy_db.yml novamente..."
            gh workflow run deploy_db.yml --ref main
          else
            echo "✅ Nenhuma ação necessária para o deploy do banco."
          fi

      - name: 📊 Gerar Step Summary do Release
        if: always()
        run: |
          echo "## 🚀 Relatório de Release Oficial (Produção)" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falha' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag Oficial** | \`${{ steps.get_tag.outputs.new_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changelog** | Atualizado via Git Cliff (\`cliff.toml\`) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Versão ${{ steps.get_tag.outputs.new_tag }} promovida com sucesso para produção!**" >> $GITHUB_STEP_SUMMARY
