name: 🚀 Production Pipeline
on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Dependencies
        run: uv sync
      - name: Run Tests
        run: uv run pytest
      - name: 📊 Summary de Testes
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## 🧪 Relatório de Testes Automatizados (Produção)" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ 100% Aprovados |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falhas detectadas |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Python Runtime** | \`3.13\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package Manager** | \`uv (astral-sh/setup-uv@v5)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY

  release_prod:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_DEPLOY_VOX }}

      - name: Configurar Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calcular Próxima Versão Dinâmica (SemVer via Conventional Commits)
        id: get_tag
        run: |
          python3 scripts/calc_next_version.py --prefix "v" --export-github

      - name: Gerar Changelog (Git Cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.get_tag.outputs.new_tag }} --prepend CHANGELOG.md

      - name: Sincronizar versão em pyproject.toml e uv.lock
        env:
          NEW_TAG: ${{ steps.get_tag.outputs.new_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          ver = os.environ["NEW_TAG"].lstrip("v")

          pyproject = Path("pyproject.toml")
          pyproject_text = pyproject.read_text(encoding="utf-8")
          pyproject_updated, count_py = re.subn(
              r'(\[project\][\s\S]*?^version\s*=\s*")([^"]+)(")',
              rf'\g<1>{ver}\g<3>',
              pyproject_text,
              count=1,
              flags=re.MULTILINE,
          )
          if count_py != 1:
              raise RuntimeError("Não foi possível atualizar version em pyproject.toml")
          pyproject.write_text(pyproject_updated, encoding="utf-8")

          uvlock = Path("uv.lock")
          uvlock_text = uvlock.read_text(encoding="utf-8")
          uvlock_updated, count_uv = re.subn(
              r'(\[\[package\]\]\s*\nname\s*=\s*"vox-ai"\s*\nversion\s*=\s*")([^"]+)(")',
              rf'\g<1>{ver}\g<3>',
              uvlock_text,
              count=1,
          )
          if count_uv != 1:
              raise RuntimeError("Não foi possível atualizar version em uv.lock")
          uvlock.write_text(uvlock_updated, encoding="utf-8")
          print(f"✅ pyproject.toml e uv.lock sincronizados para {ver}")
          PY

      - name: Commitar, Taggear e Push
        env:
          NEW_TAG: ${{ steps.get_tag.outputs.new_tag }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TOKEN_DEPLOY_VOX }}
        run: |
          git add CHANGELOG.md pyproject.toml uv.lock

          if git diff --staged --quiet; then
            echo "🚫 Changelog e arquivos de versão não mudaram."
          else
            git commit -m "chore(release): atualiza changelog e versão para ${NEW_TAG} [skip ci]"
          fi

          git tag "$NEW_TAG"

          git remote set-url origin "https://emn-f:${TOKEN}@github.com/${REPO}.git"
          
          git push origin main --tags

          echo "✅ Versão Oficial ${NEW_TAG} lançada!"

      - name: Publicar GitHub Release Oficial
        env:
          GH_TOKEN: ${{ secrets.TOKEN_DEPLOY_VOX }}
          NEW_TAG: ${{ steps.get_tag.outputs.new_tag }}
        run: |
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "ℹ️ Release $NEW_TAG já existe."
            exit 0
          fi

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          tag = os.environ["NEW_TAG"]
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(^##\s+\[?{re.escape(tag)}\]?[^\n]*\n[\s\S]*?)(?=\n##\s+|\Z)"
          match = re.search(pattern, content, flags=re.MULTILINE)
          notes = match.group(1).strip() if match else f"Release {tag}"
          Path("/tmp/release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

          gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file /tmp/release_notes.md --latest
          rm -f /tmp/release_notes.md

      - name: Verificar se o último deploy do banco falhou e re-executar
        env:
          GH_TOKEN: ${{ secrets.TOKEN_DEPLOY_VOX }}
        run: |
          STATUS=$(gh run list --workflow deploy_db.yml --limit 1 --json status --jq '.[0].status' 2>/dev/null || echo "")
          CONCLUSION=$(gh run list --workflow deploy_db.yml --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "")
          
          echo "Último status do deploy_db: $STATUS"
          echo "Última conclusão do deploy_db: $CONCLUSION"
          
          if [ "$STATUS" = "completed" ] && { [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "timed_out" ]; }; then
            echo "⚠️ O último deploy do banco falhou ou foi cancelado. Disparando deploy_db.yml novamente..."
            gh workflow run deploy_db.yml --ref main
          else
            echo "✅ Nenhuma ação necessária para o deploy do banco."
          fi

      - name: 📊 Gerar Step Summary do Release
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NEW_TAG: ${{ steps.get_tag.outputs.new_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## 🚀 Relatório de Release Oficial (Produção)" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ Sucesso |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falha |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Tag Oficial** | \`$NEW_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changelog** | Atualizado via Git Cliff (\`cliff.toml\`) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Versão $NEW_TAG promovida com sucesso para produção!**" >> $GITHUB_STEP_SUMMARY
