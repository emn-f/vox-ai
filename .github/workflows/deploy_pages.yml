name: 🌐 Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["🚀 Production Pipeline"]
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - 'index.html'
      - 'pages/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages Site & Inject Supabase Credentials
        env:
          SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          mkdir -p _site
          cp index.html CHANGELOG.md _site/
          cp -r pages _site/

          python3 - <<'PY'
          import os
          from pathlib import Path

          target = Path("_site/pages/dashboard.js")
          content = target.read_text(encoding="utf-8")
          content = content.replace("__SUPABASE_URL_DEV__", os.environ.get("SUPABASE_URL_DEV", ""))
          content = content.replace("__SUPABASE_ANON_KEY_DEV__", os.environ.get("SUPABASE_ANON_KEY_DEV", ""))
          target.write_text(content, encoding="utf-8")
          PY

          echo "✅ Site preparado em _site/ e credenciais injetadas com segurança"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📊 Gerar Step Summary do GitHub Pages
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## 🌐 Relatório de Deploy no GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ Publicado com sucesso |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falha na publicação |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **URL** | [${PAGE_URL}](${PAGE_URL}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY
