name: 🛡️ Semgrep SAST Security Analysis

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Executa semanalmente aos domingos às 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-scan:
    name: Semgrep SAST Code & Secrets Scanner
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Audit
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/python" \
            --config "p/secrets" \
            --sarif \
            --output semgrep.sarif \
            --severity ERROR \
            --error

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: 📊 Gerar Step Summary da Análise SAST
        if: always()
        run: |
          echo "## 🛡️ Relatório de Segurança SAST (Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Varredura** | ${{ job.status == 'success' && '✅ Nenhuma vulnerabilidade crítica detectada' || '⚠️ Vulnerabilidades ou erros encontrados' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem Semgrep** | \`semgrep/semgrep:1.183.0\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Regras Aplicadas** | \`p/security-audit\`, \`p/owasp-top-ten\`, \`p/python\`, \`p/secrets\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artefato SARIF** | Enviado para a aba Security do GitHub |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
