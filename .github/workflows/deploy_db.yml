name: 🎲 Deploy Database Changes

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔬 Análise Técnica
        run: |
          echo "📂 ARQUIVOS ENCONTRADOS"
          ls -1 supabase/migrations/*.sql 2>/dev/null || echo "Nenhum arquivo .sql encontrado"
      - name: 🕵️ Debug de Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ ERRO CRÍTICO: O token SUPABASE_ACCESS_TOKEN está vazio ou não foi carregado!"
            exit 1
          else
            echo "✅ Token carregado"
          fi

      - name: 🟢 Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🛠️ Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: 🔗 Link e Push (Produção)
        run: |
          echo "🔌 Conectando ao projeto..."
          supabase link --project-ref $SUPABASE_PROJECT_ID
          
          echo "🚀 Enviando migrações..."
          supabase db push --remote --yes

      - name: 📊 Gerar Step Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## 🎲 Relatório de Deploy de Migrações do Supabase" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Projeto Supabase** | \`${SUPABASE_PROJECT_ID}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "| **Status** | ✅ Sucesso |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Falha |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Node.js** | Node 22 (LTS) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Supabase CLI** | \`v2.84.2\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 Migrações no Repositório" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -1 supabase/migrations/*.sql >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Nenhuma migração encontrada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY