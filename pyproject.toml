[project]
name = "vox-ai"
version = "5.1.0"
description = "Vox AI: Assistente de apoio e informação LGBTQIA+ com Inteligência Artificial"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=1.57.0",
    "gtts>=2.5.4",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.30",
    "streamlit>=1.40.0",
    "supabase>=2.27.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v --strict-markers --no-header --tb=short"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (require external APIs)",
]

