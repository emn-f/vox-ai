<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Vox AI — Informação é uma forma de cuidado">
  <defs>
    <linearGradient id="ribbonRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E7383B"/>
      <stop offset="20%" stop-color="#F77F00"/>
      <stop offset="40%" stop-color="#FFD000"/>
      <stop offset="60%" stop-color="#00A859"/>
      <stop offset="80%" stop-color="#0084C8"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>

    <clipPath id="banner-mic-clip">
      <path d="M 26 37 A 37 37 0 0 1 100 37 L 100 49.5 L 81.5 49.5 A 5.5 5.5 0 0 0 81.5 60.5 L 100 60.5 L 100 101 A 37 37 0 0 1 26 101 Z"/>
      <path d="M 0 91 A 6.5 6.5 0 0 1 13 91 L 13 101 A 50 50 0 0 0 113 101 L 113 91 A 6.5 6.5 0 0 1 126 91 L 126 101 A 63 63 0 0 1 0 101 Z"/>
      <path d="M 52 161 Q 56.5 162.5 56.5 167 L 56.5 173 Q 56.5 177 52 177 L 74 177 Q 69.5 177 69.5 173 L 69.5 167 Q 69.5 162.5 74 161 Z"/>
      <rect x="39" y="177" width="48" height="13" rx="6.5" ry="6.5"/>
    </clipPath>
    <linearGradient id="bn-red" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F21D2F"/><stop offset="100%" stop-color="#FA4B26"/></linearGradient>
    <linearGradient id="bn-org" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F77F1E"/><stop offset="100%" stop-color="#FAA232"/></linearGradient>
    <linearGradient id="bn-yel" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFCA0A"/><stop offset="100%" stop-color="#FFD824"/></linearGradient>
    <linearGradient id="bn-grn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1EA343"/><stop offset="100%" stop-color="#2EB54A"/></linearGradient>
    <linearGradient id="bn-blu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1E62C8"/><stop offset="100%" stop-color="#2F72D6"/></linearGradient>
    <linearGradient id="bn-vio" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#533F94"/><stop offset="100%" stop-color="#6A489B"/></linearGradient>
    <linearGradient id="bn-mag" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9A4896"/><stop offset="100%" stop-color="#B154A4"/></linearGradient>
    <linearGradient id="bn-ai" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFC71C"/><stop offset="100%" stop-color="#F7A81B"/></linearGradient>
  </defs>

  <!-- Fundo branco editorial -->
  <rect width="1200" height="480" fill="#FFFFFF"/>

  <!-- Faixa Arco-íris Superior Oficial -->
  <rect x="0" y="0" width="1200" height="14" fill="url(#ribbonRainbow)"/>

  <!-- Header Superior estilo Post Editorial -->
  <text x="80" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="1.5px">
    PROJETO VOX · ACOLHIMENTO E DIREITOS
  </text>

  <!-- Linha divisória horizontal sutil -->
  <line x1="80" y1="90" x2="1120" y2="90" stroke="#F1F5F9" stroke-width="2"/>

  <!-- LADO ESQUERDO: Texto e Badges com leitura ampla -->
  <text x="80" y="168" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="38" font-weight="800" fill="#0F172A">
    <tspan x="80" dy="0">Informação é uma</tspan>
    <tspan x="80" dy="48">forma de cuidado.</tspan>
  </text>

  <text x="80" y="280" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17.5" font-weight="400" fill="#475569">
    <tspan x="80" dy="0">Assistente virtual de apoio emocional, orientação jurídica</tspan>
    <tspan x="80" dy="28">e cidadania LGBTQIA+, com escuta ativa e acolhimento ético.</tspan>
  </text>

  <!-- Badges dos Pilares Institucionais -->
  <g transform="translate(80, 375)">
    <rect x="0" y="0" width="128" height="36" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="4.5" fill="#E7383B"/>
    <text x="30" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#475569">Inclusão Total</text>

    <rect x="138" y="0" width="142" height="36" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="156" cy="18" r="4.5" fill="#0084C8"/>
    <text x="168" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#475569">Anonimato LGPD</text>

    <rect x="290" y="0" width="132" height="36" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="308" cy="18" r="4.5" fill="#00A859"/>
    <text x="320" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#475569">Rede de Apoio</text>

    <rect x="432" y="0" width="128" height="36" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="450" cy="18" r="4.5" fill="#7209B7"/>
    <text x="462" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#475569">Voz &amp; Escuta</text>
  </g>

  <!-- LADO DIREITO: Logotipo Vetorial Oficial Vox AI (Variação A) -->
  <g transform="translate(656, 178) scale(0.785)">
    <g clip-path="url(#banner-mic-clip)">
      <g transform="translate(63,95) rotate(-45)">
        <rect x="-180" y="-180" width="360" height="133.9" fill="url(#bn-red)"/>
        <rect x="-180" y="-46.5" width="360" height="20.9" fill="url(#bn-org)"/>
        <rect x="-180" y="-26.0" width="360" height="20.9" fill="url(#bn-yel)"/>
        <rect x="-180" y="-5.5"  width="360" height="20.9" fill="url(#bn-grn)"/>
        <rect x="-180" y="15.0"  width="360" height="20.9" fill="url(#bn-blu)"/>
        <rect x="-180" y="35.5"  width="360" height="20.9" fill="url(#bn-vio)"/>
        <rect x="-180" y="56.0"  width="360" height="140"  fill="url(#bn-mag)"/>
      </g>
    </g>
    <g fill="#3D4043">
      <path d="M 156 43 L 183.5 43 L 213 117.5 L 242.5 43 L 270 43 L 227 146 L 199 146 Z"/>
      <path d="M 308 63 A 43.5 42.5 0 1 1 307.99 63 Z M 308 85 A 18.5 20.5 0 1 0 308.01 85 Z" fill-rule="evenodd"/>
      <path d="M 355 66 L 383.5 66 L 398.5 89.5 L 413.5 66 L 441.5 66 L 413 105.5 L 442.5 146 L 414 146 L 398.5 121.5 L 383 146 L 354 146 L 384 105.5 Z"/>
    </g>
    <g fill="url(#bn-ai)">
      <path d="M 486.5 43 L 513.5 43 L 556 146 L 528.5 146 L 520 125 L 480 125 L 471.5 146 L 444 146 Z M 500 68 L 486.5 105 L 513.5 105 Z" fill-rule="evenodd"/>
      <path d="M 565 43 L 591 43 L 591 146 L 565 146 Z"/>
    </g>
  </g>
</svg>
